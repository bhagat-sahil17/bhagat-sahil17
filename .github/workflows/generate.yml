name: Generate Life Heatmap

on:
  push:
    paths:
      - 'growth.json'
      - 'generate_heatmap.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Heatmap Script
        run: python generate_heatmap.py

      - name: Commit and Push Heatmap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heatmap.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update heatmap svg" && git push)
